version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fleet-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fleetai_root
      MYSQL_DATABASE: fleet_ai
      MYSQL_USER: fleetai
      MYSQL_PASSWORD: fleetai123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  mysql_data:
