version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nexus-ai-mysql
    environment:
      MYSQL_DATABASE: nexus_ai
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    container_name: nexus-ai-backend
    build: ./backend
    environment:
      PORT: 4000
      JWT_SECRET: super-secret
      CORS_ORIGIN: "*"
      # CORRIGIDO: Agora batendo com o usuário, senha e banco definidos acima
      DATABASE_URL: mysql://nexus:nexus@mysql:3306/nexus_ai
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    container_name: nexus-ai-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data: